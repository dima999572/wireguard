---
- name: Ensure SSD TRIM timer is enabled for disk health
  ansible.builtin.service:
    name: fstrim.timer
    state: started
    enabled: yes

- name: Configure Docker logging limits
  ansible.builtin.copy:
    src: docker-daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker

- name: Set system timezone to UTC
  ansible.builtin.timezone:
    name: UTC

- name: Enable IPv4 forwarding
  ansible.builtin.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: true

- name: Enable IPv6 forwarding
  ansible.builtin.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '1'
    state: present
    reload: true

- name: Allow incoming traffic from Tailscale to be forwarded out (DOCKER-USER)
  ansible.builtin.iptables:
    chain: DOCKER-USER
    in_interface: tailscale0
    jump: ACCEPT
    action: insert
    rule_num: 1
    comment: "Allow Tailscale exit node routing"

- name: Allow return traffic back to Tailscale devices (DOCKER-USER)
  ansible.builtin.iptables:
    chain: DOCKER-USER
    out_interface: tailscale0
    ctstate:
      - RELATED
      - ESTABLISHED
    jump: ACCEPT
    action: insert
    rule_num: 2
    comment: "Allow Tailscale exit node return traffic"

- name: Masquerade outgoing traffic to internet (NAT)
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    out_interface: "{{ ansible_default_ipv4.interface }}"
    jump: MASQUERADE
    action: append
    comment: "Masquerade all outbound WAN traffic including Tailscale"

- name: Ensure iptables-persistent is installed so rules survive reboot (Debian/Ubuntu)
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
    update_cache: yes

- name: Save iptables rules to disk
  ansible.builtin.command: netfilter-persistent save
  changed_when: false
