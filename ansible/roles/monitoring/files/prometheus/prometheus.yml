global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    # cAdvisor labels containers as `name`; expose Kubernetes-style
    # `container`/`service` aliases so community dashboards work unchanged.
    metric_relabel_configs:
      - source_labels: [name]
        target_label: container
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
