---
- name: Ensure WireGuard config directory exists
  file:
    path: "{{ wg_stack_dir }}"
    state: directory
    mode: '0755'

- name: Copy client WireGuard config to Pi
  copy:
    src: "{{ playbook_dir }}/../client_profiles/raspberry/raspberry.conf"
    dest: "{{ wg_stack_dir }}/wg0.conf"
    mode: '0600'

- name: Render Nginx Config
  template:
    src: nginx.conf.j2
    dest: "{{ wg_stack_dir }}/nginx.conf"
  when: enable_nginx | default(false)

- name: Render Docker Compose
  template:
    src: docker-compose.yml.j2
    dest: "{{ wg_stack_dir }}/docker-compose.yml"

- name: Deploy and Start Services
  community.docker.docker_compose_v2:
    project_src: "{{ wg_stack_dir }}"
    state: present
    pull: always 