---
# Connection details from the environment (see .env).
ansible_host: "{{ lookup('env', 'PI_HOST') }}"
ansible_user: "{{ lookup('env', 'PI_USER') }}"
ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_key"
# become uses sudo on the Pi. Run `make ansible-setup-pi-sudo` once so
# PI_USER has NOPASSWD (SSH keys cover login only, not sudo).
ansible_become: true
