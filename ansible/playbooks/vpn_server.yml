---
- name: Install and configure WireGuard Server
  hosts: vpn_server
  become: yes
  tasks:
    - name: Install WireGuard and dependencies
      apt:
        name:
          - wireguard
          - resolvconf
        state: present
        update_cache: yes

    - name: Ensure WireGuard directory exists
      file:
        path: /etc/wireguard
        state: directory
        mode: '0700'

    - name: Check if private key exists
      stat:
        path: /etc/wireguard/private.key
      register: wg_key_exists

    - name: Generate WireGuard server keys
      shell: wg genkey | tee /etc/wireguard/private.key | wg pubkey > /etc/wireguard/public.key
      when: not wg_key_exists.stat.exists

    - name: Register server private key
      command: cat /etc/wireguard/private.key
      register: wg_private_key_raw
      changed_when: false
      no_log: true

    - name: Register server public key
      command: cat /etc/wireguard/public.key
      register: wg_public_key_raw
      changed_when: false

    - name: Enable IPv4 forwarding in sysctl
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes

    - name: Ensure Client Subfolders Exist
      delegate_to: localhost
      file:
        path: "{{ playbook_dir }}/../client_profiles/{{ item.name }}"
        state: directory
        mode: '0755'
      loop: "{{ vpn_clients }}"

    - name: Generate Keys for All Clients
      delegate_to: localhost
      shell: "wg genkey | tee private.key | wg pubkey > public.key"
      args:
        chdir: "{{ playbook_dir }}/../client_profiles/{{ item.name }}"
        creates: "{{ playbook_dir }}/../client_profiles/{{ item.name }}/public.key"
      loop: "{{ vpn_clients }}"

    - name: Create server configuration
      template:
        src: ../templates/server.conf.j2
        dest: /etc/wireguard/wg0.conf
      vars:
        server_tunnel_ip: "{{ vpn_server_internal_ip }}"
        server_port: "{{ vpn_server_port }}"
      notify: Restart WireGuard

  handlers:
    - name: Restart WireGuard
      systemd:
        name: wg-quick@wg0
        state: restarted
        enabled: yes
